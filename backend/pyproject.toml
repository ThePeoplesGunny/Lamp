[project]
name = "lamp"
version = "0.2.0"
description = "Biblical analytical tool — investigation platform for original Hebrew/Greek texts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "networkx>=3.4",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["lamp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
